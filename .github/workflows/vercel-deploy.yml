name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm ci

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          production: true

# Secrets required in the repository settings:
# - VERCEL_TOKEN (Personal token)
# - VERCEL_ORG_ID
# - VERCEL_PROJECT_ID
# Also add any runtime env vars your app needs (e.g. POSTGRES_URL, JWT_SECRET) via the Vercel Dashboard or GitHub Secrets as appropriate.
